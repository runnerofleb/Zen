  if(id==='account')return script('verify')+(d?'<div class="conversation-lane"><label for="lane">Coach focus</label><select id="lane">'+Object.entries({tax:'Tax services',agent:'Registered agent',books:'Money Pro',setup:'Business setup',website:'Website'}).map(([key,label])=>'<option value="'+key+'" '+(d.lane===key?'selected':'')+'>'+label+'</option>').join('')+'</select><small>Changes suggestions. Every section stays available.</small></div>':'')+'<div class="coverage-board">'+Object.entries(C.SERVICES).map(([key,label])=>'<button data-action="'+(d?'coverage':'new-deal')+'"><span>'+h(label)+'</span><em class="'+coverage(d,key)+'">'+coverageLabel(coverage(d,key))+'</em>'+(d?.coverageNotes[key]?'<small>'+h(d.coverageNotes[key])+'</small>':'')+'</button>').join('')+'</div><div class="desk-action-row">'+record(d,'Update account coverage','coverage','','small primary')+record(d,'Customer details','edit-deal')+'</div>';
  if(id==='tax')return script('tax')+'<div class="desk-two-up">'+prompt('Planning during the year','When a tax question comes up during the year, who helps you work through it?')+prompt('Filing at year end','Who is preparing and filing the returns, and what is included?')+'</div>'+prompt('Records underneath it','How are you keeping the records that person will need?')+hint('Connect the dots','Confirm which parts are already handled. Explore the parts the customer actually wants help with.')+'<div class="desk-action-row">'+record(d,'Capture their priority','evidence','data-key="need"')+record(d,'Update coverage','coverage')+jump('Explore tax options','offers')+'</div>';
  if(id==='education')return '<p class="section-intro">Choose the topic they care about, use an approved explanation, then check their understanding.</p><div class="education-grid">'+[
   ['Business structure','What have you been told about how this business is treated for tax purposes?','Clarify their question; a tax professional confirms the treatment for their situation.'],
   ['Planning through the year','How are you planning for what you may owe as income starts coming in?','Use the current approved explanation of planning and estimated payments.'],
   ['Expenses & records','What business expenses have you started tracking so far?','Explain record organization. A professional determines the treatment of specific expenses.'],
   ['Professional support','What would you want to be able to ask a tax professional before year end?','Connect only the verified service scope to the question they named.']
  ].map(([label,q,note])=>'<div>'+prompt(label,q,note)+'</div>').join('')+'</div>'+prompt('Check the value','Which part of that would be most useful for your business?')+record(d,'Capture what matters','evidence','data-key="impact"');
  if(['agent','books','website'].includes(id)){
   const prompts={agent:['agent','What, if anything, would you want to change about the arrangement you have now?'],books:['books','Where does that process take more time or effort than you would like?'],website:[null,'What do you need customers to be able to find or do online?']},p=prompts[id];
   return (p[0]?script(p[0]):prompt('Start with the need',p[1]))+(p[0]?prompt('Explore the gap',p[1]):hint('Verify the package','Check deliverables, account access, domain and hosting terms before recommending a website service.'))+serviceRow(d,id)+record(d,'Capture their priority','evidence','data-key="need"');
  }
  if(id==='setup')return script('setup')+['ein','agreement','licenses'].map(key=>serviceRow(d,key)).join('');
  if(id==='offers')return products(d);
  if(id==='objections')return objections(d);
  if(id==='close'){
   const q=d?.quote,ready=d?C.commitReady(d):'Add a customer to save the decision.';
   return prompt('Connect the recommendation',d?.facts.need?'You said “'+d.facts.need+'”. Based on that, I recommend '+(q?q.lines.map(l=>l.name).join(' + '):'[the fitting option]')+'. How well does that match what you wanted?':'You said [their priority]. This option addresses it through [verified capability]. How well does that match what you wanted?')+
    prompt('Ask clearly',q&&C.quoteValid(q)?'The initial amount is '+C.money(C.quoteTotal(q))+', with a total commitment of '+C.money(C.contractTotal(q))+'. '+q.terms+' Would you like to get this started?':'With [verified scope, price, and terms] clear, would you like to get this started?')+
    '<div class="desk-action-row">'+btn(icon('pause')+' Pause & listen','silence','small ghost','data-silence')+jump('They have a concern','objections')+'</div>'+hint('Record what happened',ready||'The supporting details are captured. Record the customer’s actual decision.')+'<div class="desk-action-row">'+record(d,'Customer agreed','accept','','small primary')+record(d,'Customer declined','decline')+jump('Review the offer','offers')+'</div>';
  }
  if(id==='payment')return payment(d);
  if(id==='activate')return script('activate')+'<div class="desk-action-row">'+record(d,'Confirm completed activation','activate','','small primary')+record(d,'Schedule the first session','task')+'</div>'+(d?.activatedAt?'<div class="notice">Activation confirmed '+h(stamp(d.activatedAt))+'.</div>':'');
  if(id==='follow')return script('follow')+(d?.task?'<div class="follow-summary"><strong>'+h(d.task.purpose)+'</strong><p>'+h(stamp(d.task.at))+' · '+h(d.task.owner)+'</p>'+pill(d.task.done?'Completed':d.task.confirmed?'Customer agreed':'Internal reminder',d.task.done?'good':'')+'</div>':'')+'<div class="desk-action-row">'+record(d,d?.task?'Edit next event':'Set the next event','task','','small primary')+(d?.task&&!d.task.done?record(d,'Mark complete','complete-task'):'')+'</div>';
  if(id==='recap')return d?'<div class="recap-tools">'+record(d,'Edit working notes','notes')+btn(icon('copy')+' Copy Salesforce recap','copy-recap','small primary')+btn('Copy follow-up draft','copy-email','small ghost',d.doNotContact?'disabled':'')+'</div><label for="recap-text">Salesforce recap</label><textarea id="recap-text" readonly class="copy-block">'+h(C.recap(data,d))+'</textarea><p class="explanation">Prepared for review and pasting into Salesforce. No CRM update has been sent.</p>'+(!d.doNotContact?'<details class="email-preview"><summary>Read the follow-up draft</summary><textarea readonly class="copy-block" aria-label="Follow-up email draft">'+h(C.email(data,d))+'</textarea></details>':'<p class="notice warn">This customer asked not to be contacted.</p>'):prompt('Leave a useful recap',guide('recap').ask)+hint('Your notes stay with the customer','Add a customer to save notes, prepare a Salesforce recap, and draft a follow-up.')+btn('Add customer','new-deal','small primary');
  if(id==='history')return d?'<div class="timeline">'+[...d.history].reverse().map(e=>'<div class="timeline-item">'+h(e.message)+'<small>'+h(stamp(e.at))+'</small></div>').join('')+'<div class="timeline-item">Deal created<small>'+h(stamp(d.createdAt))+'</small></div></div>':'<p class="section-intro">Customer updates appear here as you record them. Browsing the desk does not create a deal.</p>';
  if(id==='reference')return '<div class="reference-links"><a class="btn ghost" href="https://runnerofleb.github.io/Zen/junecallguideofficial.html" target="_blank" rel="noopener">'+icon('book')+' Original training guide '+icon('arrow')+'</a>'+btn('Browse the playbook','nav','ghost','data-view="playbook"')+btn('Practice an objection','practice-drill','ghost','data-category="thinking"')+btn('Catalog sources','catalog','ghost')+'</div><div class="shortcuts-table"><span>Search sections and actions</span><kbd>⌘ / Ctrl K</kbd><span>Toggle focus view</span><kbd>F</kbd><span>Objection library</span><kbd>O</kbd><span>Products & pricing</span><kbd>P</kbd><span>Working notes</span><kbd>M</kbd><span>Previous / next section</span><kbd>Alt ← / →</kbd></div><p class="explanation">Shortcuts stay inactive while you type. Prices in the reference catalog must be verified for the current account.</p>';
  return '';
 }

 function serviceRow(d,id){
  const p=ctx.state().catalog.find(x=>x.id===id);if(!p)return '';
  const state=coverage(d,id),notes={ein:'Ask whether an EIN is already assigned. Explain the paid assistance and the direct application option.',agreement:'Ask what is already in place and what help they want with the agreement.',licenses:'Clarify whether they need a report identifying requirements. A report does not issue licenses.',agent:'Confirm the current provider and the actual responsibilities they want help with.',books:'Connect the verified tools to their existing workflow.',website:'Confirm the current package and the customer’s own online goals.'};
  return '<div class="service-row"><div><div class="row wrap"><h3>'+h(p.name)+'</h3>'+pill(coverageLabel(state),state==='gap'?'good':'')+'</div><p>'+h(notes[id])+'</p></div><div class="desk-action-row">'+record(d,'Coverage','coverage')+jump('Compare options','offers')+'</div></div>';
 }

 function products(d){
  const {catalog}=ctx.state(),q=d?.quote,rec=d?C.recommendation(d,catalog):null,index=d?.entity==='multi'?1:0;
  let current='';
  if(q)current='<div class="current-offer"><div class="between wrap"><span class="eyebrow">CURRENT RECOMMENDATION</span>'+pill(C.quoteValid(q)?'Price verified':'Reverification needed',C.quoteValid(q)?'good':'warn')+'</div><h3>'+h(q.lines.map(l=>l.name).join(' + '))+'</h3><p>'+h(q.scope)+'</p><div class="quote-amounts"><span><b>'+C.money(C.quoteTotal(q))+'</b> initial amount</span><span><b>'+C.money(C.contractTotal(q))+'</b> total commitment</span></div><p>'+h(q.terms)+'</p><small>Source: '+h(q.source)+' · valid until '+h(stamp(q.expiresAt))+'</small><div class="desk-action-row">'+(!d.acceptedAt?record(d,'Edit / reverify','quote','data-product="'+attr(q.lines[0].productId)+'"')+record(d,'Remove recommendation','remove-quote'):C.grossPaid(ctx.state().data,d.id)===0?record(d,'Reopen offer','unlock-offer'):'')+jump('Ask for the decision','close','small primary')+'</div></div>';
  else if(rec)current='<div class="recommended-strip"><div>'+icon('spark')+' <b>Suggested fit: '+h(rec.name)+'</b><small>Based on the recorded need and confirmed gaps. Needs price verification.</small></div>'+record(d,'Verify offer','quote','data-product="'+attr(rec.id)+'"','small primary')+'</div>';
  return current+'<div class="between wrap catalog-heading"><div><h3>Every option, always available</h3><p>Browse now. Confirm fit and current terms before making an offer.</p></div>'+record(d,'Review coverage','coverage')+'</div><div class="catalog-entity"><span>Reference pricing for</span>'+['single','multi'].map((v,i)=>btn(i?'Multi-member / other':'Single-member','catalog-entity',ctx.state().catalogEntity===v||!ctx.state().catalogEntity&&index===i?'small selected':'small ghost','data-entity="'+v+'"')).join('')+'</div><div class="product-grid">'+catalog.map(p=>{
   const idx=ctx.state().catalogEntity==='multi'?1:ctx.state().catalogEntity==='single'?0:index,price=p.annual?.[idx],monthly=p.monthly?.[idx],fit=d&&p.services.every(k=>d.coverage[k]==='gap');
   return '<article class="product-card '+(rec?.id===p.id?'suggested':'')+'"><div class="between">'+pill(p.once?'One-time service':'Ongoing service')+(fit?pill('Matches gaps','good'):'')+'</div><h3>'+h(p.name)+'</h3><p>'+h(p.scope)+'</p><div class="reference-price">'+(price?'<b>'+C.money(price)+'</b><span> / '+(p.once?'service':'year')+'</span>':'<b class="unpriced">Confirm current price</b>')+'</div>'+(monthly?'<small class="reference-monthly">Reference monthly option: '+C.money(monthly)+'</small>':'')+'<div class="product-coverage">'+p.services.map(k=>'<span class="'+coverage(d,k)+'">'+h(C.SERVICES[k])+' · '+h(coverageLabel(coverage(d,k)))+'</span>').join('')+'<small class="catalog-source">'+h(p.source)+'</small>'+record(d,d?'Review & verify':'Add customer to build offer','quote','data-product="'+attr(p.id)+'"','small ghost wide')+'</article>';
  }).join('')+'</div><p class="explanation">Reference amounts are not current quotes. Imported catalog sources appear on each option. Verify account eligibility, billing, service scope, renewal and cancellation terms before presenting a price.</p>';
 }

 function objections(d){
  const current=d?.objection;
  return (current?'<div class="current-concern"><div class="between wrap"><span class="eyebrow">THE CUSTOMER SAID</span>'+pill(current.resolved?'Resolved':'Open concern',current.resolved?'good':'warn')+'</div><p>“'+h(current.quote)+'”</p>'+record(d,'Edit this concern','objection')+'</div>':'')+'<p class="section-intro">Pick the concern you heard. Clarify it, answer the actual question, then check whether that helped.</p><div class="objection-library">'+Object.entries(C.OBJECTIONS).map(([key,o])=>'<article><h3>'+h(o.label)+'</h3>'+prompt('Ask to clarify',o.question)+'<p class="listen-for"><b>Listen for</b> '+h(o.listen)+'</p><div class="desk-action-row">'+record(d,'Capture this concern','objection','data-category="'+key+'"')+btn('Practice','practice-drill','small ghost','data-category="'+key+'"')+'</div></article>').join('')+'</div>';
 }

 function payment(d){
  const {data}=ctx.state(),q=d?.quote,net=d?C.netPaid(data,d.id):0;
  return prompt('Confirm authorization',q&&C.quoteValid(q)?'To confirm, we are adding '+q.lines.map(l=>l.name).join(' + ')+' for '+C.money(C.quoteTotal(q))+' initially. '+q.terms+' Do I have your permission to proceed?':'To confirm, we are adding [service] for [exact charge and disclosed terms]. Do I have your permission to proceed?')+'<div class="payment-status">'+[['Verified offer',q&&C.quoteValid(q),'offers'],['Customer agreed',d?.acceptedAt,'close'],['Authorized',d?.authorizedAt,'payment'],['Payment confirmed',net>0,'payment']].map(([title,done,key])=>'<button class="'+(done?'done':'')+'" data-action="desk-jump" data-section="'+key+'">'+icon(done?'check':'clock')+'<span>'+title+'</span></button>').join('')+'</div><div class="desk-action-row">'+record(d,'Record authorization','authorize')+record(d,'Record confirmed payment','payment','','small primary')+(net>0?record(d,'Record a refund','refund'):'')+'</div><div class="payment-ledger"><div class="between"><span class="eyebrow">PAYMENT RECORDS</span><strong>Net collected '+C.money(net)+'</strong></div>'+(d?data.events.filter(e=>e.dealId===d.id).map(e=>'<div class="mini-row"><span>'+h(e.type==='payment'?'Collected':'Refunded')+' · '+h(e.reference)+'<small>'+h(stamp(e.at))+'</small></span><b>'+C.money(e.amount)+'</b></div>').join(''):'')+'</div><p class="explanation">Process the charge in your approved system, then record its successful reference here. Agreement and authorization alone do not count as paid revenue.</p>';
 }

 function support(d,modal=false){
  const notesId=modal?'modal-call-notes':'call-notes';
  const {data,catalog,coachVisible}=ctx.state(),a=d?C.action(data,d,catalog):null,q=d?.quote,net=d?C.netPaid(data,d.id):0;
  return '<section class="support-card coach-card"><div class="between"><span class="eyebrow">'+icon('spark')+' OPTIONAL COACH</span><button class="iconbtn" data-action="toggle-coach" aria-label="'+(coachVisible?'Hide':'Show')+' coaching suggestion" aria-expanded="'+coachVisible+'">'+icon(coachVisible?'close':'plus')+'</button></div>'+(coachVisible?'<h3>'+h(a?.title||'Follow their priority')+'</h3><p>'+h(a?.question||'What would make this conversation useful for you?')+'</p><div class="desk-action-row">'+(a?jump('Go to suggestion',suggestedSection(a)):'')+btn('Open guide','guided','small ghost')+'</div>':'<small>Available whenever you want a prompt.</small>')+'</section><section class="support-card support-notes"><div class="between"><label for="'+notesId+'">Working notes</label>'+record(d,icon('edit'),'notes','','small ghost')+'</div><textarea id="'+notesId+'" '+(!d?'disabled':'')+' placeholder="'+(d?'Capture anything. Keep talking.':'Add a customer to save notes.')+'">'+h(d?.notes||'')+'</textarea><small>'+(d?'Saves as you type · stays with this customer':'Browse without creating a customer.')+'</small></section><section class="support-card support-snapshot"><div class="between"><h3>Buyer snapshot</h3>'+record(d,'Edit','evidence')+'</div>'+Object.entries(C.FACTS).map(([k,label])=>'<button data-action="'+(d?'evidence':'new-deal')+'" data-key="'+k+'"><span>'+h(label)+'</span><strong class="'+(d?.facts[k]?'':'muted')+'">'+h(d?.facts[k]||'Not captured')+'</strong></button>').join('')+'</section><section class="support-card support-offer"><div class="between"><h3>Offer at a glance</h3>'+jump('Open','offers')+'</div><p>'+h(q?q.lines.map(l=>l.name).join(' + '):'No offer saved yet')+'</p><div class="mini-row"><span>Initial quote</span><b>'+C.money(C.quoteTotal(q))+'</b></div><div class="mini-row"><span>Net collected</span><b>'+C.money(net)+'</b></div><div class="compact-milestones">'+[['Agreed',d?.acceptedAt],['Authorized',d?.authorizedAt],['Paid',net>0]].map(([t,done])=>'<span class="'+(done?'done':'')+'">'+icon(done?'check':'clock')+t+'</span>').join('')+'</div></section><section class="support-card"><div class="between"><h3>Next commitment</h3>'+jump('Open','follow')+'</div><p>'+h(d?.task&&!d.task.done?d.task.purpose:'No next event set')+'</p>'+(d?.task&&!d.task.done?'<small>'+h(stamp(d.task.at))+'</small>':'')+'</section>';
 }
 function suggestedSection(a){return {permission:'open',evidence:'discovery',coverage:'account',offer:'offers',objection:'objections',decision:'discovery',accept:'close',authorize:'payment',payment:'payment',activate:'activate',covered:'account',closed:'recap',refunded:'payment',complete:'recap'}[a.kind]||'discovery';}
 function searchResults(query){
  const q=query.trim().toLowerCase();
  const items=[...sections.map(s=>({title:s.title,detail:s.group,keywords:s.keywords,action:'desk-jump',extra:'data-section="'+s.id+'"',icon:s.icon})),{title:'New customer',detail:'ACTION',keywords:'new deal account',action:'new-deal',extra:'',icon:'plus'},{title:'Working notes',detail:'ACTION',keywords:'capture write',action:'notes',extra:'',icon:'edit'},{title:'Copy Salesforce recap',detail:'ACTION',keywords:'crm copy',action:'copy-recap',extra:'',icon:'copy'},{title:'Set a follow-up',detail:'ACTION',keywords:'callback next event schedule',action:'task',extra:'',icon:'clock'}].filter(x=>!q||[x.title,x.detail,x.keywords].join(' ').toLowerCase().includes(q));
  return items.length?items.map(x=>'<button class="jump-result" data-action="'+x.action+'" '+x.extra+'>'+icon(x.icon)+'<span><b>'+h(x.title)+'</b><small>'+h(x.detail)+'</small></span>'+icon('arrow')+'</button>').join(''):'<p class="no-results">No matching section. Try “tax,” “payment,” or “notes.”</p>';
 }
 return {render,support,searchResults,sections};
}
root.RevDeskOpenDesk={create,sections};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
window.REVENUE_DESK_PREVIEW = true;
(function(){
'use strict';
const C=window.RevDeskCore,D=window.RevDeskData,app=document.getElementById('app'),dialog=document.getElementById('dialog');
const KEY='revdesk:v3:workspace',DEMO_KEY='revdesk:v3:practice';
let practice=window.REVENUE_DESK_PREVIEW===true,view=window.REVENUE_DESK_PREVIEW?'desk':'today',pane='flow',filter='open',query='',range='today',guideId='open',toastTimer,storageWarning='',conflict=false,answerDraft='',answerKey='',noteTimer;
let data=practice?loadPractice():loadWorkspace(),catalog=data.catalog||D.catalog,lastFocus=null;
let deskSection='overview',deskFocus=false,coachVisible=true,catalogEntity='',lastDeskKey='',deskScrolls=new Map();
const icons={grid:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',phone:'M5 3h4l2 5-3 2a16 16 0 0 0 6 6l2-3 5 2v4c0 1-1 2-2 2C10 21 3 14 3 5c0-1 1-2 2-2Z',chart:'M4 20V10 M10 20V4 M16 20v-8 M22 20H2',book:'M12 6c-3-3-7-3-10-2v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 2Z M12 6v15',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 M13 6l6 6-6 6',chevron:'m9 5 7 7-7 7',check:'m5 12 4 4L19 6',close:'m6 6 12 12 M18 6 6 18',clock:'M12 8v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z',target:'M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z M18 12a6 6 0 1 1-12 0 6 6 0 0 1 12 0Z M14 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z',search:'M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z m-2 5 6 6',copy:'M8 8h12v13H8z M16 8V3H3v13h5',download:'M12 3v12 m-5-5 5 5 5-5 M3 16v5h18v-5',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z',edit:'m15 4 5 5 M4 20l5-1L21 7l-4-4L5 15Z',shield:'m12 2 9 4v6c0 5-9 10-9 10S3 17 3 12V6Z m-5 10 3 3 6-6',info:'M12 11v6 M12 7h.01 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0Z',pause:'M8 5v14 M16 5v14',play:'m7 4 14 8-14 8Z',wallet:'M3 5h17v15H3z M16 10h6v6h-6z',message:'M3 3h18v14H8l-5 4Z M7 7h10 M7 11h6',logout:'M9 3H3v18h6 M10 12h12 m-5-5 5 5-5 5',moon:'M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11Z'};

const attr=h;
const active=()=>data.deals.find(d=>d.id===data.activeId)||null;
const live=()=>data.sessions.find(s=>!s.endedAt);
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase();
const btn=(label,action,cls='',extra='')=>'<button type="button" class="btn '+cls+'" data-action="'+action+'" '+extra+'>'+label+'</button>';
const pill=(label,cls='')=>'<span class="pill '+cls+'">'+h(label)+'</span>';
const stamp=(at,options={})=>at?new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:data.settings.timeZone,...options}).format(new Date(at)):'Not scheduled';
const dateToday=()=>C.dayKey(new Date().toISOString(),data.settings.timeZone);
const pct=n=>n===null?'—':Math.round(n*100)+'%';
const timeLength=seconds=>Math.floor(seconds/60).toString().padStart(2,'0')+':'+Math.floor(seconds%60).toString().padStart(2,'0');
const typeStatus=d=>{const s=C.status(data,d);return pill(s,['Paid','Activated'].includes(s)?'good':['Follow-up','Accepted','Authorized'].includes(s)?'warn':['Declined','Refunded'].includes(s)?'bad':'');};
function loadWorkspace(){
 try{const raw=localStorage.getItem(KEY);if(raw){const w=C.validateWorkspace(JSON.parse(raw));if(w.catalog)w.catalog=D.validateCatalog(w.catalog);return w;}
 const old=localStorage.getItem('zbcm_june_call');return old?C.migrateLegacy(JSON.parse(old)):C.workspace();}
 catch(e){storageWarning='Existing data could not be loaded. It has been left untouched. Export a backup or resolve storage access before saving.';conflict=true;return C.workspace();}
}
function loadPractice(){try{const raw=localStorage.getItem(DEMO_KEY);return raw?C.validateWorkspace(JSON.parse(raw)):D.demo(C);}catch(_){const w=D.demo(C);try{w.revision=JSON.parse(localStorage.getItem(DEMO_KEY)||'{}').revision||0;}catch(__){}return w;}}
function persist(){
 const key=practice?DEMO_KEY:KEY;
 const revision=data.revision;

if(name==='complete-task'){if(d.task){d.task.done=true;C.addHistory(d,'Next step completed: '+d.task.purpose);refreshDeal(d,'Next step completed.');}return;}
if(name==='copy-recap'){await copy(C.recap(data,d));return;}
if(name==='copy-email'){if(d.doNotContact)throw new Error('This customer has asked not to be contacted.');await copy(C.email(data,d));return;}
if(name==='notes'){openModal('Working notes',form('notes',field('Notes for this customer','notes',d.notes,{textarea:true,rows:8}),'Save notes'));return;}
if(name==='silence'){silenceUntil=Date.now()+7000;updateTimers();return;}
if(name==='remove-quote'){if(d.acceptedAt)throw new Error('Reopen the accepted offer first.');d.quote=null;d.facts.fit='';d.facts.criterion='';C.addHistory(d,'Unaccepted recommendation removed');refreshDeal(d,'Recommendation removed. No revenue changed.');return;}
if(name==='unlock-offer'){if(C.grossPaid(data,d.id)>0)throw new Error('A paid offer is kept with its transaction history. Create a separate deal for a new purchase.');openModal('Reopen the offer',form('unlock',field('What changed?','reason','',{required:true,textarea:true,placeholder:'Record why the offer needs to change'})+'<p class="muted" style="font-size:12px">The prior agreement and authorization will be cleared. New terms require fresh customer agreement.</p>','Reopen offer'));return;}
}
async function submitForm(el){const f=Object.fromEntries(new FormData(el).entries()),kind=el.dataset.form,d=active(),now=new Date().toISOString();
if(kind==='deal'){
 const existing=data.deals.find(x=>x.id===el.dataset.id);const values={};for(const k of ['name','business','email','phone','industry','entity','source'])values[k]=String(f[k]||'').trim();if(!values.name)throw new Error('Enter the customer’s name.');
 if(existing){Object.assign(existing,values);if(!data.sessions.some(s=>s.dealId===existing.id))existing.cohort=f.cohort==='baseline'?'baseline':'adaptive';C.addHistory(existing,'Customer details updated');}
 else{const nd=C.deal({...values,cohort:f.cohort});data.deals.push(nd);data.activeId=nd.id;}
 save('Customer saved.');closeModal();view='desk';pane='flow';if(!existing)deskSection='overview';render();return;
}
if(kind==='settings'){
 new Intl.DateTimeFormat('en-US',{timeZone:f.timeZone});const target=Number(f.targetDeals);if(!Number.isInteger(target)||target<1||target>1000)throw new Error('Choose a daily goal between 1 and 1,000.');data.settings={...data.settings,repName:f.repName.trim(),targetDeals:target,timeZone:f.timeZone.trim()};document.documentElement.dataset.theme=f.theme;try{localStorage.setItem('rd_theme',f.theme);}catch(_){}save('Preferences saved.');closeModal();render();return;
}
if(kind==='drill'){const o=C.OBJECTIONS[f.category]||C.OBJECTIONS.thinking;openModal('Review your response','<div class="notice"><span class="eyebrow">YOUR RESPONSE</span><p style="margin-top:10px">'+h(f.response)+'</p></div><div style="margin-top:20px">'+check('acknowledge','I acknowledged the concern without arguing.')+check('clarify','I asked one clear question to understand the actual blocker.')+check('listen','I left room to listen instead of immediately pitching another option.')+'</div><div class="notice" style="margin-top:20px"><span class="eyebrow">A QUESTION TO TRY</span><p style="font-family:Georgia,serif;font-size:22px;margin-top:10px">'+h(o.question)+'</p></div><p class="explanation">Self-review only. No automated quality score is assigned.</p><div class="form-actions">'+btn('Try again','practice-drill','ghost','data-category="'+attr(f.category)+'"')+btn('Done','dismiss','primary')+'</div>');return;}
if(!d)throw new Error('Choose a customer first.');
if(kind==='answer'){const key=el.dataset.key;if(!C.FACTS[key])throw new Error('Unknown evidence field.');d.facts[key]=f.answer.trim();if(!d.facts[key])throw new Error('Record what the customer actually said.');if(key==='decision'){d.decisionType=f.decisionType;d.decisionReady=!!f.decisionReady;}C.addHistory(d,C.FACTS[key]+' captured: '+d.facts[key]);answerDraft='';if(dialog.open)closeModal();refreshDeal(d,'Buyer evidence saved.');return;}
if(kind==='evidence'){for(const k of Object.keys(C.FACTS))d.facts[k]=String(f[k]||'').trim();d.decisionType=f.decisionType;d.decisionReady=!!f.decisionReady;C.addHistory(d,'Buyer evidence updated');}
else if(kind==='coverage'){for(const k of Object.keys(C.SERVICES)){if(!['unknown','covered','gap','na'].includes(f[k]))throw new Error('Choose a valid coverage state.');d.coverage[k]=f[k];d.coverageNotes[k]=String(f['note-'+k]||'').trim();}C.addHistory(d,'Coverage confirmed from account and customer');}
else if(kind==='quote'){
 const p=catalog.find(p=>p.id===f.productId);if(!p)throw new Error('Product not found.');const months=Number(f.months);const expires=new Date(f.expires+'T23:59:59').toISOString();
 const q={id:C.uid(),lines:[{productId:p.id,name:p.name,amount:C.cents(f.amount),services:[...p.services],billing:f.billing,months}],scope:f.scope.trim(),terms:f.terms.trim(),source:f.source.trim(),verified:!!f.verified,verifiedAt:now,expiresAt:expires,catalogVersion:p.version};C.saveQuote(d,q);pane='offer';
}
else if(kind==='objection'){if(!C.OBJECTIONS[f.category])throw new Error('Choose a concern category.');if(f.resolved&&(!f.clarification.trim()||!f.resolution.trim()))throw new Error('Record the clarified concern, the answer, and the customer’s confirmation before marking it resolved.');d.objection={category:f.category,quote:f.quote.trim(),clarification:f.clarification.trim(),resolution:f.resolution.trim(),resolved:!!f.resolved};C.addHistory(d,(d.objection.resolved?'Concern resolved: ':'Concern captured: ')+d.objection.quote);}
else if(kind==='task'){const at=new Date(f.at).toISOString();if(d.doNotContact&&f.confirmed)throw new Error('This customer asked not to be contacted. Reopen only at their request.');d.task={id:C.uid(),kind:f.kind,purpose:f.purpose.trim(),at,owner:f.owner.trim(),confirmed:!!f.confirmed,done:false};if(!d.task.purpose||!d.task.owner)throw new Error('Record a purpose and owner.');C.addHistory(d,d.task.confirmed?'Customer agreed to follow-up':'Internal next step created');C.addHistory(d,'Next step: '+d.task.purpose+' · '+at);}
else if(kind==='accept'||kind==='authorize'){if(!f.confirmed)throw new Error('Confirm the customer’s explicit '+(kind==='accept'?'agreement':'authorization')+'.');if(kind==='accept')C.accept(d);else C.authorize(d);pane='offer';}
else if(kind==='payment'){C.recordPayment(data,d,{amount:C.cents(f.amount),reference:f.reference,confirmed:!!f.confirmed});pane='offer';}
else if(kind==='refund'){C.recordRefund(data,d,{paymentId:f.paymentId,amount:C.cents(f.amount),reference:f.reference,confirmed:!!f.confirmed});pane='offer';}
else if(kind==='activation'){if(!f.confirmed||!f.detail.trim())throw new Error('Record and confirm the completed activation step.');C.activate(data,d);C.addHistory(d,'Activation detail: '+f.detail.trim());}
else if(kind==='end-call'){C.endSession(data,d,f.outcome);pane='follow';}
else if(kind==='decline'){d.disposition='declined';d.lossReason=f.reason;d.doNotContact=!!f.doNotContact;if(d.task)d.task.done=true;C.addHistory(d,'Customer declined: '+f.reason+' · '+f.detail.trim());if(d.doNotContact)C.addHistory(d,'Customer requested no further contact');}
else if(kind==='reopen'){if(!f.confirmed)throw new Error('Confirm the customer requested to reopen.');d.disposition='open';d.doNotContact=false;d.lossReason='';d.acceptedAt=null;d.authorizedAt=null;d.permission=false;C.addHistory(d,'Customer requested to reopen: '+f.detail.trim());}
else if(kind==='unlock'){d.acceptedAt=null;d.authorizedAt=null;d.facts.fit='';d.facts.criterion='';C.addHistory(d,'Offer reopened; fresh agreement required: '+f.reason.trim());}
else if(kind==='notes'){d.notes=f.notes;}
else return;
save('Saved to this customer.');closeModal();render();if(kind==='end-call')jumpToSection('recap');
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;e.preventDefault();Promise.resolve(handleAction(b)).catch(err=>{if(dialog.open){const box=dialog.querySelector('.form-error');if(box){box.textContent=err.message;return;}}toast(err.message||'That action could not be completed.');});});
document.addEventListener('submit',e=>{const el=e.target.closest('[data-form]');if(!el)return;e.preventDefault();const box=el.querySelector('.form-error');if(box)box.textContent='';Promise.resolve(submitForm(el)).catch(err=>{if(box)box.textContent=err.message||'Check the fields and try again.';else toast(err.message);});});
let searchTimer;
document.addEventListener('input',e=>{
if(e.target.id==='jump-query'){document.getElementById('jump-results').innerHTML=Desk.searchResults(e.target.value);return;}
if(e.target.id==='buyer-answer'){answerDraft=e.target.value;return;}
if(e.target.id==='deal-search'){query=e.target.value;clearTimeout(searchTimer);const start=e.target.selectionStart;searchTimer=setTimeout(()=>{render();const input=document.getElementById('deal-search');input?.focus();try{input?.setSelectionRange(start,start);}catch(_){}},180);return;}
if(['call-notes','modal-call-notes'].includes(e.target.id)){const d=active();if(d){d.notes=e.target.value;d.updatedAt=new Date().toISOString();clearTimeout(noteTimer);noteTimer=setTimeout(()=>save(),350);}return;}
});
document.addEventListener('change',async e=>{try{
if(e.target.id==='lane'){const d=active();d.lane=e.target.value;refreshDeal(d,'Conversation focus updated.');return;}
if(e.target.name==='category'&&e.target.closest('[data-form=objection]')){const o=C.OBJECTIONS[e.target.value];document.getElementById('objection-question').innerHTML='<span class="eyebrow">ASK TO CLARIFY</span><p style="margin-top:9px">'+h(o.question)+'</p>';document.getElementById('objection-options').innerHTML=o.options.map(t=>'<button type="button" data-action="objection-chip" data-value="'+attr(t)+'">'+h(t)+'</button>').join('');return;}
if(['restore-file','catalog-file'].includes(e.target.id)){
const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw new Error('Choose a JSON file smaller than 10 MB.');const value=JSON.parse(await file.text());
if(e.target.id==='catalog-file'){data.catalog=D.validateCatalog(value);save('Catalog imported. Customer quotes still need verification.');catalogNow();settingsDialog();return;}
if(live())throw new Error('End the active call before restoring a backup.');pendingImport=C.validateWorkspace(value);if(pendingImport.catalog)pendingImport.catalog=D.validateCatalog(pendingImport.catalog);
openModal('Review the backup before restoring','<p>This will replace the '+(practice?'practice':'real')+' workspace in this browser.</p><div class="notice"><b>Current workspace:</b> '+data.deals.length+' deals, '+data.events.length+' transaction records.<br><b>Selected backup:</b> '+pendingImport.deals.length+' deals, '+pendingImport.events.length+' transaction records.</div><div style="margin-top:18px">'+btn('Export current workspace first','backup','ghost')+'</div>'+check('replace-confirm','Replace this workspace with the selected backup.')+'<div class="form-error" role="alert"></div><div class="form-actions">'+btn('Cancel','dismiss','ghost')+btn('Restore backup','restore-confirm','primary')+'</div>');}
}catch(err){toast(err.message||'This file could not be read.');}});
dialog.addEventListener('click',e=>{if(e.target===dialog){const rect=dialog.getBoundingClientRect();if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom)closeModal();}});
window.addEventListener('storage',e=>{if(e.key!==(practice?DEMO_KEY:KEY))return;conflict=true;storageWarning='Another tab updated this workspace. Export any unsaved work and reload before continuing.';renderWarning();});
window.addEventListener('beforeunload',e=>{if(storageWarning||conflict){e.preventDefault();e.returnValue='';}else if(noteTimer){clearTimeout(noteTimer);persist();}});
document.addEventListener('keydown',e=>{
 const key=e.key.toLowerCase(),typing=e.target.closest('input,textarea,select,[contenteditable]');
 if((e.metaKey||e.ctrlKey)&&key==='k'){e.preventDefault();jumpDialog();return;}
 if(e.target.id==='jump-query'&&e.key==='Enter'){e.preventDefault();document.getElementById('jump-results')?.querySelector('.jump-result')?.click();return;}
 if(dialog.open||typing)return;
 if(e.altKey&&view==='desk'&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const i=Desk.sections.findIndex(s=>s.id===deskSection),next=Math.max(0,Math.min(Desk.sections.length-1,i+(e.key==='ArrowRight'?1:-1)));jumpToSection(Desk.sections[next].id);return;}
 if(e.metaKey||e.ctrlKey||e.altKey)return;
 if(key==='n'){e.preventDefault();dealDialog();}
 else if(key==='d'){e.preventDefault();setView('desk');}
 else if(key==='h'){e.preventDefault();setView('today');}
 else if(key==='o'){e.preventDefault();jumpToSection('objections');}
 else if(key==='p'){e.preventDefault();jumpToSection('offers');}
 else if(key==='f'&&view==='desk'){e.preventDefault();deskFocus=!deskFocus;jumpToSection(deskSection);}
 else if(key==='m'){e.preventDefault();if(active())handleAction({dataset:{action:'notes'}});else dealDialog();}
 else if(e.key==='/'){e.preventDefault();jumpDialog();}
});
try{const theme=localStorage.getItem('rd_theme');if(theme==='light'||theme==='dark')document.documentElement.dataset.theme=theme;}catch(_){}
if(!conflict)persist();render();setInterval(updateTimers,1000);
})();

</script>
</body>
